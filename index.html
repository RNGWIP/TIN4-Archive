<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TIN4 Archives</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      overscroll-behavior: none;
    }
    canvas { display: block; touch-action: none; }
    #mobile-hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    #mobile-stick {
      position: absolute;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 128px;
      height: 128px;
      border: 2px solid rgba(53, 255, 207, 0.35);
      border-radius: 50%;
      background: rgba(5, 8, 6, 0.35);
      pointer-events: auto;
      touch-action: none;
    }
    #mobile-stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(53, 255, 207, 0.55);
      pointer-events: none;
    }
    #mobile-jump {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(32px, env(safe-area-inset-bottom));
      width: 84px;
      height: 84px;
      border: 2px solid rgba(53, 255, 207, 0.55);
      border-radius: 50%;
      background: rgba(5, 8, 6, 0.45);
      color: #35ffcf;
      font: 700 13px/84px monospace;
      text-align: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }
    #mobile-hint {
      position: absolute;
      left: 50%;
      top: max(16px, env(safe-area-inset-top));
      transform: translateX(-50%);
      color: rgba(53, 255, 207, 0.85);
      font: 12px/1.4 monospace;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      opacity: 1;
      transition: opacity 0.8s ease;
      padding: 0 12px;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script type="module" src="./RNGWIP-Museum-Gift-Shop.js"></script>
</body>
</html>
